<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mural Uni logo">

  <!-- Back book – olive (drawn first so teal sits on top) -->
  <polygon points="88,55 126,55 118,45 80,45" fill="#8FA033"/>
  <rect x="88" y="55" width="38" height="48" fill="#7D8F28"/>

  <!-- Front book – teal -->
  <polygon points="64,63 102,63 94,53 56,53" fill="#357878"/>
  <rect x="64" y="63" width="38" height="48" fill="#2B6F6F"/>

  <!-- Graduation cap body -->
  <rect x="84" y="26" width="32" height="19" fill="#1E3A5C"/>

  <!-- Mortarboard (flat diamond) -->
  <polygon points="100,8 130,26 100,32 70,26" fill="#1E3A5C"/>

  <!-- Tassel -->
  <line x1="130" y1="26" x2="130" y2="48" stroke="#1E3A5C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="52" r="4.5" fill="#1E3A5C"/>

  <!-- Wordmark -->
  <text x="100" y="143"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#1E3A5C">Mural</text>

  <text x="100" y="175"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        font-weight="700"
        fill="#7D8F28">Uni</text>

</svg>
